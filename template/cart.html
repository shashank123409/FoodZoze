{% extends 'base.html' %}
{% block content %}
<div class="container mt-5 pt-5">
    <h2 class="text-center mb-4">Your Shopping Cart</h2>
    <table class="table">
        <thead>
            <tr>
                <th>Dish Name</th>
                <th>Price</th>
                <th>Quantity</th>
            </tr>
        </thead>
        <tbody>
    {% for item in items %}
    <tr>
        <td>{{ item.dish_name }}</td>
        <td>₹{{ item.price }}</td>
        <td>
            <div class="d-flex align-items-center">
                <a href="/reduce-quantity/{{ item.id }}" class="btn btn-sm btn-outline-danger mr-2">-</a>
                <span>{{ item.quantity }}</span>
                <a href="/add-quantity/{{ item.id }}" class="btn btn-sm btn-outline-success ml-2">+</a>
                
                </div>
        </td>
        <td>₹{% widthratio item.price 1 item.quantity %}</td>
    </tr>
    {% endfor %}
</tbody>
    </table>
    <div class="text-right mt-4 p-3">
    <h4>Total: ₹{{ total }}</h4>
    <a href="{% url 'checkout' %}" class="btn btn-success btn-lg px-5">Checkout Now</a>
</div>
    </div>
</div>
{% endblock %}
